name: Keep Render Awake

on:
  schedule:
    # Every 14 minutes from 7 AM to 10 PM UTC (adjust timezone as needed)
    # 7 AM UTC = 07:00, 10 PM UTC = 22:00
    - cron: '*/14 7-22 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_HEALTH_URL }}" || exit 1
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}

      - name: Log result
        if: always()
        run: echo "Ping completed at $(date -u) with status ${{ job.status }}"